<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>正修科大機車停車隨手記 | CSU Parking Helper</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Tailwind Configuration for CSU Theme Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        csu: {
                            dark: '#0f2027',
                            navy: '#203a43',
                            blue: '#2c5364',
                            gold: '#f59e0b',
                            goldHover: '#d97706',
                            amber: '#fbbf24'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Mobile Web App Styles */
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom Scrollbar for subtle look */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 32, 39, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.4);
            border-radius: 4px;
        }
        /* Glassmorphic effect */
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        /* Pulse Animation for Active Parking */
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.01); }
        }
        .pulse-active {
            animation: pulse-subtle 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col min-h-screen pb-10 select-none">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-700/60 px-4 py-3 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-csu-gold to-amber-300 flex items-center justify-center shadow-md text-slate-900 font-bold">
                    <i data-lucide="bike" class="w-5 h-5 text-slate-950"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white tracking-wide leading-tight">正修科大機車停車紀錄</h1>
                    <p class="text-xs text-csu-amber font-medium">CSU Parking Helper</p>
                </div>
            </div>
            <button onclick="openHistoryModal()" class="flex items-center space-x-1 bg-slate-800/80 hover:bg-slate-700 border border-slate-600/60 text-xs px-3 py-1.5 rounded-lg transition active:scale-95">
                <i data-lucide="history" class="w-4 h-4 text-csu-gold"></i>
                <span>歷史紀錄</span>
            </button>
        </div>
    </header>

    <!-- Main Container (Mobile First Container) -->
    <main class="max-w-md w-full mx-auto px-4 pt-4 flex-1 flex flex-col space-y-4">

        <!-- 1. 校園停車資訊首頁 (Home Dashboard) - ACTIVE STATUS CARD -->
        <section id="parkingStatusSection">
            <!-- Dynamic Content Injected via JS (Active Parking vs No Parking) -->
        </section>

        <!-- Quick Actions Grid -->
        <section class="grid grid-cols-2 gap-3">
            <button onclick="openRecordModal()" class="glass-panel hover:bg-slate-800/90 p-3.5 rounded-2xl border border-amber-500/30 flex flex-col items-center justify-center text-center space-y-2 transition active:scale-95 group">
                <div class="w-10 h-10 rounded-full bg-amber-500/20 text-csu-gold flex items-center justify-center group-hover:scale-110 transition-transform">
                    <i data-lucide="map-pin-plus" class="w-5 h-5"></i>
                </div>
                <div>
                    <div class="text-sm font-semibold text-white">一鍵紀錄車位</div>
                    <div class="text-[11px] text-slate-400">快速輸入區號與照片</div>
                </div>
            </button>

            <button onclick="triggerQuickGPS()" class="glass-panel hover:bg-slate-800/90 p-3.5 rounded-2xl border border-sky-500/30 flex flex-col items-center justify-center text-center space-y-2 transition active:scale-95 group">
                <div class="w-10 h-10 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center group-hover:scale-110 transition-transform">
                    <i data-lucide="locate-fixed" class="w-5 h-5"></i>
                </div>
                <div>
                    <div class="text-sm font-semibold text-white">即時抓取 GPS</div>
                    <div class="text-[11px] text-slate-400">獲取精確經緯度</div>
                </div>
            </button>
        </section>

        <!-- Campus Preset Quick Buttons -->
        <section class="glass-panel p-4 rounded-2xl border border-slate-700/80 shadow-md">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center space-x-1.5">
                    <i data-lucide="building-2" class="w-4 h-4 text-csu-gold"></i>
                    <span>正修科大熱門停車場快捷標記</span>
                </h3>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs" id="quickLotsGrid">
                <!-- Javascript populated quick locations -->
            </div>
        </section>

        <!-- Navigation & Tools Card (Appears when parked) -->
        <section id="navigationCard" class="hidden glass-panel p-4 rounded-2xl border border-emerald-500/30 shadow-md">
            <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-3 flex items-center space-x-1">
                <i data-lucide="navigation" class="w-4 h-4"></i>
                <span>尋車導航功能</span>
            </h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="openAppleMaps()" class="flex items-center justify-center space-x-2 bg-slate-800 hover:bg-slate-700 text-white font-medium py-2.5 px-3 rounded-xl border border-slate-600 transition active:scale-95">
                    <i data-lucide="compass" class="w-4 h-4 text-sky-400"></i>
                    <span>Apple 地圖導航</span>
                </button>
                <button onclick="openGoogleMaps()" class="flex items-center justify-center space-x-2 bg-slate-800 hover:bg-slate-700 text-white font-medium py-2.5 px-3 rounded-xl border border-slate-600 transition active:scale-95">
                    <i data-lucide="map" class="w-4 h-4 text-emerald-400"></i>
                    <span>Google 地圖導航</span>
                </button>
            </div>
        </section>

    </main>

    <!-- Footer Credit -->
    <footer class="mt-auto pt-6 pb-2 text-center text-xs text-slate-500">
        <p>正修科技大學 Cheng Shiu University · 學生專用隨手記</p>
    </footer>

    <!-- ================= MODALS & SHEETS ================= -->

    <!-- RECORD PARKING MODAL -->
    <div id="recordModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity duration-200">
        <div class="glass-panel bg-slate-900 border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl space-y-4">
            
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center space-x-2">
                    <i data-lucide="square-parking" class="w-5 h-5 text-csu-gold"></i>
                    <h2 class="text-base font-bold text-white">記錄當前機車位置</h2>
                </div>
                <button onclick="closeRecordModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Form -->
            <form id="parkingForm" onsubmit="saveParkingRecord(event)" class="space-y-4">
                
                <!-- 2. 機車停車場選擇 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">1. 選擇校內/周邊停車場 *</label>
                    <select id="lotSelect" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-csu-gold transition">
                        <option value="" disabled selected>請選擇停車場區塊...</option>
                        <option value="正門 / 行政大樓機車區">正門 / 行政大樓機車區</option>
                        <option value="後門 / 宿舍區機車棚 A 區">後門 / 宿舍區機車棚 A 區</option>
                        <option value="後門 / 宿舍區機車棚 B 區">後門 / 宿舍區機車棚 B 區</option>
                        <option value="後門 / 宿舍區機車棚 C 區">後門 / 宿舍區機車棚 C 區</option>
                        <option value="體育館周邊停車區">體育館周邊停車區</option>
                        <option value="圖資大樓地下室 (B1/B2)">圖資大樓地下室 (B1/B2)</option>
                        <option value="校外周邊格位 / 自訂區域">校外周邊格位 / 自訂區域</option>
                    </select>
                </div>

                <!-- 3. 樓層與區域細節 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">2. 樓層/區域</label>
                        <input type="text" id="floorInput" placeholder="例如: 1F, B1, A區" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-csu-gold transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">柱號 / 車位號 *</label>
                        <input type="text" id="spotInput" required placeholder="例如: C-12, 048" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-csu-gold transition">
                    </div>
                </div>

                <!-- 4. GPS 定位 -->
                <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/80 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold text-slate-300 flex items-center space-x-1">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-sky-400"></i>
                            <span>4. GPS 地理位置記錄</span>
                        </span>
                        <button type="button" onclick="getGPSLocation()" id="gpsBtn" class="text-xs bg-sky-600 hover:bg-sky-500 text-white font-medium px-2.5 py-1 rounded-lg transition flex items-center space-x-1">
                            <i data-lucide="navigation" class="w-3 h-3"></i>
                            <span id="gpsBtnText">擷取 GPS</span>
                        </button>
                    </div>
                    <div id="gpsStatusText" class="text-[11px] text-slate-400 truncate">未擷取座標 (點擊上方按鈕自動抓取)</div>
                    <input type="hidden" id="latInput">
                    <input type="hidden" id="lngInput">
                </div>

                <!-- 照片上傳與預覽 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">5. 拍照備忘 (選填，方便尋車)</label>
                    <div class="flex items-center space-x-3">
                        <label class="flex-1 cursor-pointer bg-slate-800 hover:bg-slate-700 border border-dashed border-slate-600 rounded-xl p-3 flex items-center justify-center space-x-2 text-xs text-slate-300 transition">
                            <i data-lucide="camera" class="w-4 h-4 text-csu-gold"></i>
                            <span>選擇/拍攝照片</span>
                            <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handlePhotoSelect(event)" class="hidden">
                        </label>
                    </div>
                    <!-- Photo Preview Box -->
                    <div id="photoPreviewContainer" class="hidden mt-2 relative rounded-xl overflow-hidden border border-slate-700 max-h-40">
                        <img id="photoPreview" src="" alt="位置預覽照片" class="w-full h-40 object-cover">
                        <button type="button" onclick="removePhoto()" class="absolute top-2 right-2 bg-slate-900/80 text-white p-1 rounded-full hover:bg-red-600 transition">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- 備註 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">6. 補充備註</label>
                    <input type="text" id="memoInput" placeholder="例如：安全帽放車廂、隔壁停紅色勁戰..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-csu-gold transition">
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" class="w-full bg-gradient-to-r from-csu-gold to-amber-500 hover:from-amber-400 hover:to-csu-gold text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition active:scale-[0.98] flex items-center justify-center space-x-2">
                        <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                        <span>確認儲存車位紀錄</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 7. PARKING HISTORY MODAL -->
    <div id="historyModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity duration-200">
        <div class="glass-panel bg-slate-900 border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[85vh] flex flex-col shadow-2xl">
            
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                <div class="flex items-center space-x-2">
                    <i data-lucide="history" class="w-5 h-5 text-csu-gold"></i>
                    <h2 class="text-base font-bold text-white">停車歷史紀錄</h2>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="confirmClearHistory()" class="text-xs text-red-400 hover:text-red-300 bg-red-950/40 border border-red-800/40 px-2 py-1 rounded-lg">清空</button>
                    <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- History List Container -->
            <div id="historyList" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- Javascript populated -->
            </div>
        </div>
    </div>

    <!-- IMAGE FULLSCREEN PREVIEW MODAL -->
    <div id="imageViewerModal" class="fixed inset-0 z-50 bg-slate-950/90 flex items-center justify-center p-4 hidden" onclick="closeImageViewer()">
        <div class="relative max-w-lg w-full">
            <img id="fullImageView" src="" class="w-full max-h-[80vh] object-contain rounded-2xl border border-slate-700 shadow-2xl">
            <p class="text-center text-xs text-slate-400 mt-2">點擊任意處關閉照片</p>
        </div>
    </div>

    <!-- CUSTOM TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-800/95 border border-csu-gold/50 text-white text-xs px-4 py-2.5 rounded-full shadow-2xl flex items-center space-x-2 transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
        <i data-lucide="info" id="toastIcon" class="w-4 h-4 text-csu-gold"></i>
        <span id="toastMsg">通知訊息</span>
    </div>

    <!-- CUSTOM CONFIRMATION DIALOG (No native confirm alert) -->
    <div id="confirmModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="glass-panel bg-slate-900 border-slate-700 w-full max-w-xs rounded-2xl p-4 text-center space-y-3 shadow-2xl">
            <div class="w-10 h-10 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center mx-auto">
                <i data-lucide="alert-triangle" class="w-5 h-5"></i>
            </div>
            <h3 id="confirmTitle" class="text-sm font-bold text-white">確定執行此操作？</h3>
            <p id="confirmDesc" class="text-xs text-slate-400">這項動作無法復原。</p>
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="closeConfirmModal(false)" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 font-medium py-2 rounded-xl border border-slate-700">取消</button>
                <button id="confirmYesBtn" onclick="closeConfirmModal(true)" class="bg-red-600 hover:bg-red-500 text-xs text-white font-bold py-2 rounded-xl">確定刪除</button>
            </div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // --- DATA STATE ---
        let currentParking = null;
        let parkingHistory = [];
        let timerInterval = null;
        let selectedBase64Photo = '';
        let pendingConfirmCallback = null;

        // CSU Hot Locations Preset
        const csuLocations = [
            "正門 / 行政大樓機車區",
            "後門 / 宿舍區機車棚 A 區",
            "後門 / 宿舍區機車棚 B 區",
            "後門 / 宿舍區機車棚 C 區",
            "體育館周邊停車區",
            "圖資大樓地下室 (B1/B2)"
        ];

        // INITIALIZATION
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            renderQuickLotsGrid();
            renderDashboard();
            startTimer();
            lucide.createIcons();
        });

        // LOCAL STORAGE LOAD/SAVE
        function loadFromLocalStorage() {
            const savedCurrent = localStorage.getItem('csu_current_parking');
            const savedHistory = localStorage.getItem('csu_parking_history');
            
            if (savedCurrent) {
                try { currentParking = JSON.parse(savedCurrent); } catch (e) {}
            }
            if (savedHistory) {
                try { parkingHistory = JSON.parse(savedHistory); } catch (e) {}
            }
        }

        function saveToLocalStorage() {
            if (currentParking) {
                localStorage.setItem('csu_current_parking', JSON.stringify(currentParking));
            } else {
                localStorage.removeItem('csu_current_parking');
            }
            localStorage.setItem('csu_parking_history', JSON.stringify(parkingHistory));
        }

        // 1. RENDER DASHBOARD (ACTIVE VS NO PARKING)
        function renderDashboard() {
            const statusSection = document.getElementById('parkingStatusSection');
            const navCard = document.getElementById('navigationCard');

            if (currentParking) {
                // Parking Active Card
                navCard.classList.remove('hidden');
                statusSection.innerHTML = `
                    <div class="glass-panel p-5 rounded-3xl border-2 border-amber-500/40 shadow-xl pulse-active relative overflow-hidden">
                        <div class="absolute top-0 right-0 bg-gradient-to-l from-amber-500 to-amber-600 text-slate-950 font-extrabold text-[10px] uppercase tracking-wider px-3 py-1 rounded-bl-xl shadow">
                            停放中 ACTIVE
                        </div>
                        
                        <div class="flex items-center space-x-2 text-csu-amber mb-2">
                            <i data-lucide="map-pin" class="w-5 h-5"></i>
                            <span class="text-xs font-semibold tracking-wider">目前車位位置</span>
                        </div>

                        <div class="text-xl font-black text-white tracking-tight mb-1">
                            ${escapeHtml(currentParking.lotName)}
                        </div>

                        <div class="inline-flex items-center space-x-2 bg-amber-500/10 border border-amber-500/30 text-amber-300 px-3 py-1 rounded-xl text-sm font-bold mb-4">
                            <i data-lucide="footprints" class="w-4 h-4"></i>
                            <span>${escapeHtml(currentParking.floor || '1F')} · 柱號: ${escapeHtml(currentParking.spotCode)}</span>
                        </div>

                        <!-- 5. 停車時間計時 (Timer) -->
                        <div class="bg-slate-900/80 rounded-2xl p-3.5 border border-slate-700/80 mb-4 flex items-center justify-between">
                            <div class="flex items-center space-x-2 text-slate-400 text-xs">
                                <i data-lucide="timer" class="w-4 h-4 text-csu-gold"></i>
                                <span>已停放總時數：</span>
                            </div>
                            <div id="liveTimerText" class="text-base font-black text-white font-mono tracking-wider">
                                00 小時 00 分 00 秒
                            </div>
                        </div>

                        ${currentParking.photo ? `
                            <div class="mb-4 rounded-xl overflow-hidden border border-slate-700 max-h-36 relative cursor-pointer" onclick="openImageViewer('${currentParking.photo}')">
                                <img src="${currentParking.photo}" class="w-full h-36 object-cover hover:scale-105 transition duration-300">
                                <span class="absolute bottom-1.5 right-2 bg-slate-950/80 text-[10px] text-slate-300 px-2 py-0.5 rounded-md">點擊放大</span>
                            </div>
                        ` : ''}

                        ${currentParking.memo ? `
                            <div class="text-xs text-slate-300 bg-slate-800/50 p-2.5 rounded-xl border border-slate-700/50 mb-4 flex items-start space-x-2">
                                <i data-lucide="sticky-note" class="w-4 h-4 text-amber-400 shrink-0 mt-0.5"></i>
                                <span>${escapeHtml(currentParking.memo)}</span>
                            </div>
                        ` : ''}

                        <div class="flex items-center space-x-2">
                            <button onclick="confirmEndParking()" class="flex-1 bg-red-600/90 hover:bg-red-500 text-white text-xs font-bold py-2.5 px-3 rounded-xl shadow transition active:scale-95 flex items-center justify-center space-x-1.5">
                                <i data-lucide="square" class="w-4 h-4"></i>
                                <span>離場 / 結束停車</span>
                            </button>
                        </div>
                    </div>
                `;
            } else {
                // No Parking Card
                navCard.classList.add('hidden');
                statusSection.innerHTML = `
                    <div class="glass-panel p-6 rounded-3xl border border-slate-700/60 shadow-lg text-center space-y-3">
                        <div class="w-12 h-12 rounded-2xl bg-slate-800 text-slate-400 flex items-center justify-center mx-auto border border-slate-700">
                            <i data-lucide="parking-meter" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h2 class="text-base font-bold text-white">目前尚未紀錄車位</h2>
                            <p class="text-xs text-slate-400 mt-1">停好車後點擊下方按鈕，秒記停放位置與柱號</p>
                        </div>
                        <button onclick="openRecordModal()" class="w-full bg-gradient-to-r from-csu-gold to-amber-500 hover:from-amber-400 hover:to-csu-gold text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition active:scale-[0.98] flex items-center justify-center space-x-2">
                            <i data-lucide="plus-circle" class="w-5 h-5"></i>
                            <span>馬上紀錄車位</span>
                        </button>
                    </div>
                `;
            }
            lucide.createIcons();
            updateTimerDisplay();
        }

        // Render Quick Lots Buttons
        function renderQuickLotsGrid() {
            const grid = document.getElementById('quickLotsGrid');
            grid.innerHTML = csuLocations.map(loc => `
                <button onclick="quickSelectLot('${loc}')" class="bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700 text-slate-200 p-2.5 rounded-xl text-left truncate flex items-center space-x-1.5 transition active:scale-95">
                    <i data-lucide="map-pin" class="w-3.5 h-3.5 text-csu-gold shrink-0"></i>
                    <span class="truncate">${loc}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        function quickSelectLot(lotName) {
            document.getElementById('lotSelect').value = lotName;
            openRecordModal();
        }

        // 5. PARKING TIMER REALTIME TICKING
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('liveTimerText');
            if (!timerEl || !currentParking) return;

            const startTime = new Date(currentParking.startTime).getTime();
            const now = new Date().getTime();
            const diffSeconds = Math.max(0, Math.floor((now - startTime) / 1000));

            const hours = Math.floor(diffSeconds / 3600);
            const minutes = Math.floor((diffSeconds % 3600) / 60);
            const seconds = diffSeconds % 60;

            const pad = (n) => n.toString().padStart(2, '0');
            timerEl.innerText = `${pad(hours)} 小時 ${pad(minutes)} 分 ${pad(seconds)} 秒`;
        }

        // 4. GPS GEOLOCATION LOGIC
        function getGPSLocation() {
            const gpsText = document.getElementById('gpsStatusText');
            const gpsBtnText = document.getElementById('gpsBtnText');
            
            if (!navigator.geolocation) {
                showToast("您的裝置不支援 GPS 定位");
                return;
            }

            gpsText.innerText = "正在定位中...";
            gpsBtnText.innerText = "定位中";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);
                    document.getElementById('latInput').value = lat;
                    document.getElementById('lngInput').value = lng;
                    gpsText.innerText = `經緯度: ${lat}, ${lng} (精度 ±${Math.round(position.coords.accuracy)}m)`;
                    gpsText.classList.replace('text-slate-400', 'text-emerald-400');
                    gpsBtnText.innerText = "重新擷取";
                    showToast("GPS 座標抓取成功！");
                },
                (error) => {
                    gpsText.innerText = "無法獲取定位 (請檢查權限或 GPS 設定)";
                    gpsText.classList.replace('text-slate-400', 'text-red-400');
                    gpsBtnText.innerText = "重試";
                    showToast("GPS 定位失敗");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function triggerQuickGPS() {
            if (currentParking) {
                showToast(`已紀錄 GPS: ${currentParking.lat || '無'}, ${currentParking.lng || '無'}`);
            } else {
                openRecordModal();
                getGPSLocation();
            }
        }

        // PHOTO UPLOAD & BASE64 COMPRESSION
        function handlePhotoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800; // Resize to max 800px to save LocalStorage memory

                    if (width > height && width > maxDim) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else if (height > maxDim) {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    selectedBase64Photo = canvas.toDataURL('image/jpeg', 0.75);
                    
                    document.getElementById('photoPreview').src = selectedBase64Photo;
                    document.getElementById('photoPreviewContainer').classList.remove('hidden');
                    showToast("照片解析並壓縮完成");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removePhoto() {
            selectedBase64Photo = '';
            document.getElementById('photoInput').value = '';
            document.getElementById('photoPreview').src = '';
            document.getElementById('photoPreviewContainer').classList.add('hidden');
        }

        // SAVE PARKING RECORD
        function saveParkingRecord(event) {
            event.preventDefault();

            const lotName = document.getElementById('lotSelect').value;
            const floor = document.getElementById('floorInput').value.trim() || '1F';
            const spotCode = document.getElementById('spotInput').value.trim();
            const lat = document.getElementById('latInput').value;
            const lng = document.getElementById('lngInput').value;
            const memo = document.getElementById('memoInput').value.trim();

            if (!lotName || !spotCode) {
                showToast("請填寫停車場與柱號/格位號！");
                return;
            }

            // Create record
            currentParking = {
                id: 'park_' + Date.now(),
                lotName: lotName,
                floor: floor,
                spotCode: spotCode,
                lat: lat,
                lng: lng,
                photo: selectedBase64Photo,
                memo: memo,
                startTime: new Date().toISOString()
            };

            saveToLocalStorage();
            renderDashboard();
            closeRecordModal();
            showToast("成功紀錄停車位置！");
        }

        // END PARKING / DEPART
        function confirmEndParking() {
            openConfirmModal(
                "離場 / 結束停車？",
                "將結算本次停車時間並歸檔至歷史紀錄。",
                () => {
                    if (!currentParking) return;

                    const endTime = new Date().toISOString();
                    const startTime = new Date(currentParking.startTime).getTime();
                    const durationMs = new Date(endTime).getTime() - startTime;

                    const historyItem = {
                        ...currentParking,
                        endTime: endTime,
                        durationMinutes: Math.max(1, Math.floor(durationMs / (1000 * 60)))
                    };

                    parkingHistory.unshift(historyItem); // prepend
                    currentParking = null;

                    saveToLocalStorage();
                    renderDashboard();
                    showToast("已結束停車，記錄已歸檔！");
                }
            );
        }

        // 6. MAP NAVIGATIONS (APPLE MAPS & GOOGLE MAPS)
        function openAppleMaps() {
            if (!currentParking) return;
            let url = '';
            if (currentParking.lat && currentParking.lng) {
                // Apple Maps Walking Mode Deep Link
                url = `https://maps.apple.com/?daddr=${currentParking.lat},${currentParking.lng}&dirflg=w`;
            } else {
                // Fallback search by lot name
                url = `https://maps.apple.com/?q=${encodeURIComponent('正修科技大學 ' + currentParking.lotName)}`;
            }
            window.open(url, '_blank');
        }

        function openGoogleMaps() {
            if (!currentParking) return;
            let url = '';
            if (currentParking.lat && currentParking.lng) {
                url = `https://www.google.com/maps/dir/?api=1&destination=${currentParking.lat},${currentParking.lng}&travelmode=walking`;
            } else {
                url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('正修科技大學 ' + currentParking.lotName)}`;
            }
            window.open(url, '_blank');
        }

        // 7. HISTORY MODAL RENDERING
        function openHistoryModal() {
            renderHistoryList();
            document.getElementById('historyModal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.add('hidden');
        }

        function renderHistoryList() {
            const listEl = document.getElementById('historyList');
            if (parkingHistory.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-8 text-slate-500 space-y-2">
                        <i data-lucide="inbox" class="w-8 h-8 mx-auto opacity-50"></i>
                        <p class="text-xs">目前尚無歷史停車紀錄</p>
                    </div>
                `;
            } else {
                listEl.innerHTML = parkingHistory.map((item, index) => {
                    const startStr = new Date(item.startTime).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    const hours = Math.floor(item.durationMinutes / 60);
                    const mins = item.durationMinutes % 60;
                    const durationStr = hours > 0 ? `${hours}小時 ${mins}分` : `${mins}分鐘`;

                    return `
                        <div class="bg-slate-800/80 border border-slate-700 p-3 rounded-2xl flex flex-col space-y-2 relative">
                            <div class="flex items-start justify-between">
                                <div>
                                    <div class="text-sm font-bold text-white">${escapeHtml(item.lotName)}</div>
                                    <div class="text-xs text-csu-amber font-semibold mt-0.5">${escapeHtml(item.floor || '1F')} · 柱號: ${escapeHtml(item.spotCode)}</div>
                                </div>
                                <button onclick="deleteHistoryItem(${index})" class="text-slate-500 hover:text-red-400 p-1">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>

                            <div class="flex items-center justify-between text-[11px] text-slate-400 bg-slate-900/50 px-2.5 py-1.5 rounded-xl">
                                <span>時間: ${startStr}</span>
                                <span class="text-slate-300 font-medium">停放: ${durationStr}</span>
                            </div>

                            ${item.photo ? `
                                <div class="mt-1">
                                    <img src="${item.photo}" onclick="openImageViewer('${item.photo}')" class="h-20 w-full object-cover rounded-xl border border-slate-700 cursor-pointer">
                                </div>
                            ` : ''}

                            ${item.memo ? `<div class="text-[11px] text-slate-400 italic">備註: ${escapeHtml(item.memo)}</div>` : ''}
                        </div>
                    `;
                }).join('');
            }
            lucide.createIcons();
        }

        function deleteHistoryItem(index) {
            openConfirmModal("刪除這筆紀錄？", "這項紀錄將從歷史列表中永久刪除。", () => {
                parkingHistory.splice(index, 1);
                saveToLocalStorage();
                renderHistoryList();
                showToast("已刪除該筆紀錄");
            });
        }

        function confirmClearHistory() {
            if (parkingHistory.length === 0) return;
            openConfirmModal("清空所有歷史紀錄？", "確定要清空全部的停車紀錄嗎？此動作不可逆。", () => {
                parkingHistory = [];
                saveToLocalStorage();
                renderHistoryList();
                showToast("歷史紀錄已清空");
            });
        }

        // MODAL HELPERS
        function openRecordModal() {
            document.getElementById('recordModal').classList.remove('hidden');
        }

        function closeRecordModal() {
            document.getElementById('recordModal').classList.add('hidden');
            // reset photo input
            removePhoto();
        }

        function openImageViewer(src) {
            document.getElementById('fullImageView').src = src;
            document.getElementById('imageViewerModal').classList.remove('hidden');
        }

        function closeImageViewer() {
            document.getElementById('imageViewerModal').classList.add('hidden');
        }

        // CUSTOM CONFIRM MODAL (Replaces alert/confirm)
        function openConfirmModal(title, desc, onYes) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmDesc').innerText = desc;
            pendingConfirmCallback = onYes;
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeConfirmModal(isYes) {
            document.getElementById('confirmModal').classList.add('hidden');
            if (isYes && typeof pendingConfirmCallback === 'function') {
                pendingConfirmCallback();
            }
            pendingConfirmCallback = null;
        }

        // CUSTOM TOAST NOTIFICATION
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;
            
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 2600);
        }

        // UTILS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
    </script>
</body>
