<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>正修科大機車停車隨手記 | CSU Parking Helper</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        .glass-panel {
            background: rgba(18, 18, 20, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-zinc-100 flex flex-col min-h-screen pb-10 select-none">

    <!-- Header -->
    <header class="sticky top-0 z-40 glass-panel border-b border-zinc-800 px-4 py-3 shadow-md">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-zinc-100 text-zinc-950 flex items-center justify-center font-bold shadow">
                    <!-- Bike Icon -->
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white tracking-wide leading-tight">正修科大機車停車紀錄</h1>
                    <p class="text-xs text-zinc-400 font-medium">CSU Parking Helper</p>
                </div>
            </div>
            <button onclick="openHistoryModal()" class="flex items-center space-x-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs px-3 py-1.5 rounded-lg transition active:scale-95 text-zinc-200">
                <!-- History Icon -->
                <svg class="w-4 h-4 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                <span>歷史紀錄</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md w-full mx-auto px-4 pt-4 flex-1 flex flex-col space-y-4">

        <!-- Parking Status Card -->
        <section id="parkingStatusSection"></section>

        <!-- Quick Actions Grid -->
        <section class="grid grid-cols-2 gap-3">
            <button onclick="openRecordModal()" class="glass-panel hover:bg-zinc-800/80 p-4 rounded-2xl border border-zinc-700 flex flex-col items-center justify-center text-center space-y-2 transition active:scale-95 group">
                <div class="w-11 h-11 rounded-full bg-zinc-800 text-zinc-100 flex items-center justify-center border border-zinc-700 group-hover:bg-zinc-700 transition">
                    <!-- Map Pin Plus Icon -->
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
                </div>
                <div>
                    <div class="text-sm font-semibold text-white">一鍵紀錄車位</div>
                    <div class="text-[11px] text-zinc-400">快速輸入區號與照片</div>
                </div>
            </button>

            <button onclick="triggerQuickGPS()" class="glass-panel hover:bg-zinc-800/80 p-4 rounded-2xl border border-zinc-700 flex flex-col items-center justify-center text-center space-y-2 transition active:scale-95 group">
                <div class="w-11 h-11 rounded-full bg-zinc-800 text-zinc-100 flex items-center justify-center border border-zinc-700 group-hover:bg-zinc-700 transition">
                    <!-- Locate Icon -->
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/></svg>
                </div>
                <div>
                    <div class="text-sm font-semibold text-white">即時抓取 GPS</div>
                    <div class="text-[11px] text-zinc-400">獲取精確經緯度</div>
                </div>
            </button>
        </section>

        <!-- Quick Lots Preset -->
        <section class="glass-panel p-4 rounded-2xl border border-zinc-800 shadow-sm">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-xs font-bold text-zinc-300 uppercase tracking-wider flex items-center space-x-1.5">
                    <svg class="w-4 h-4 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/></svg>
                    <span>正修科大熱門停車場快捷標記</span>
                </h3>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs" id="quickLotsGrid"></div>
        </section>

        <!-- Navigation Card (Shown when parked) -->
        <section id="navigationCard" class="hidden glass-panel p-4 rounded-2xl border border-zinc-700 shadow-md">
            <h3 class="text-xs font-bold text-zinc-300 uppercase tracking-wider mb-3 flex items-center space-x-1">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
                <span>尋車導航功能</span>
            </h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="openAppleMaps()" class="flex items-center justify-center space-x-2 bg-zinc-800 hover:bg-zinc-700 text-white font-medium py-2.5 px-3 rounded-xl border border-zinc-600 transition active:scale-95">
                    <span>Apple 地圖導航</span>
                </button>
                <button onclick="openGoogleMaps()" class="flex items-center justify-center space-x-2 bg-zinc-800 hover:bg-zinc-700 text-white font-medium py-2.5 px-3 rounded-xl border border-zinc-600 transition active:scale-95">
                    <span>Google 地圖導航</span>
                </button>
            </div>
        </section>

    </main>

    <footer class="mt-auto pt-6 pb-2 text-center text-xs text-zinc-600">
        <p>正修科技大學 Cheng Shiu University · 學生專用隨手記</p>
    </footer>

    <!-- RECORD PARKING MODAL -->
    <div id="recordModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="glass-panel bg-zinc-900 border-zinc-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl space-y-4">
            
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <h2 class="text-base font-bold text-white">記錄當前機車位置</h2>
                <button onclick="closeRecordModal()" class="text-zinc-400 hover:text-white p-1 rounded-lg">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>

            <form id="parkingForm" onsubmit="saveParkingRecord(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1.5">1. 選擇校內/周邊停車場 *</label>
                    <select id="lotSelect" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-zinc-400 transition">
                        <option value="" disabled selected>請選擇停車場區塊...</option>
                        <option value="正門 / 行政大樓機車區">正門 / 行政大樓機車區</option>
                        <option value="後門 / 宿舍區機車棚 A 區">後門 / 宿舍區機車棚 A 區</option>
                        <option value="後門 / 宿舍區機車棚 B 區">後門 / 宿舍區機車棚 B 區</option>
                        <option value="後門 / 宿舍區機車棚 C 區">後門 / 宿舍區機車棚 C 區</option>
                        <option value="體育館周邊停車區">體育館周邊停車區</option>
                        <option value="圖資大樓地下室 (B1/B2)">圖資大樓地下室 (B1/B2)</option>
                        <option value="校外周邊格位 / 自訂區域">校外周邊格位 / 自訂區域</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-300 mb-1.5">2. 樓層/區域</label>
                        <input type="text" id="floorInput" placeholder="例如: 1F, B1, A區" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-zinc-400 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-300 mb-1.5">柱號 / 車位號 *</label>
                        <input type="text" id="spotInput" required placeholder="例如: C-12, 048" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-zinc-400 transition">
                    </div>
                </div>

                <div class="bg-zinc-800/60 p-3 rounded-xl border border-zinc-700/80 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold text-zinc-300">4. GPS 地理位置記錄</span>
                        <button type="button" onclick="getGPSLocation()" id="gpsBtn" class="text-xs bg-zinc-700 hover:bg-zinc-600 text-white font-medium px-2.5 py-1 rounded-lg transition border border-zinc-600">
                            <span id="gpsBtnText">擷取 GPS</span>
                        </button>
                    </div>
                    <div id="gpsStatusText" class="text-[11px] text-zinc-400 truncate">未擷取座標 (點擊上方按鈕自動抓取)</div>
                    <input type="hidden" id="latInput">
                    <input type="hidden" id="lngInput">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1.5">5. 拍照備忘 (選填)</label>
                    <label class="flex-1 cursor-pointer bg-zinc-800 hover:bg-zinc-700 border border-dashed border-zinc-600 rounded-xl p-3 flex items-center justify-center space-x-2 text-xs text-zinc-300 transition">
                        <span>選擇/拍攝照片</span>
                        <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handlePhotoSelect(event)" class="hidden">
                    </label>
                    <div id="photoPreviewContainer" class="hidden mt-2 relative rounded-xl overflow-hidden border border-zinc-700 max-h-40">
                        <img id="photoPreview" src="" class="w-full h-40 object-cover">
                        <button type="button" onclick="removePhoto()" class="absolute top-2 right-2 bg-black/80 text-white p-1 rounded-full">✕</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1.5">6. 補充備註</label>
                    <input type="text" id="memoInput" placeholder="例如：安全帽放車廂..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-zinc-400 transition">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-white hover:bg-zinc-200 text-zinc-950 font-bold py-3 px-4 rounded-xl shadow-md transition active:scale-[0.98]">
                        確認儲存車位紀錄
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- PARKING HISTORY MODAL -->
    <div id="historyModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="glass-panel bg-zinc-900 border-zinc-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[85vh] flex flex-col shadow-2xl">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3 mb-3">
                <h2 class="text-base font-bold text-white">停車歷史紀錄</h2>
                <div class="flex items-center space-x-2">
                    <button onclick="confirmClearHistory()" class="text-xs text-zinc-400 hover:text-white bg-zinc-800 border border-zinc-700 px-2 py-1 rounded-lg">清空</button>
                    <button onclick="closeHistoryModal()" class="text-zinc-400 hover:text-white p-1 rounded-lg">✕</button>
                </div>
            </div>
            <div id="historyList" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-zinc-800 border border-zinc-600 text-white text-xs px-4 py-2.5 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
        <span id="toastMsg">通知訊息</span>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let currentParking = null;
        let parkingHistory = [];
        let timerInterval = null;
        let selectedBase64Photo = '';

        const csuLocations = [
            "正門 / 行政大樓機車區",
            "後門 / 宿舍區機車棚 A 區",
            "後門 / 宿舍區機車棚 B 區",
            "後門 / 宿舍區機車棚 C 區",
            "體育館周邊停車區",
            "圖資大樓地下室 (B1/B2)"
        ];

        window.onload = function() {
            loadFromLocalStorage();
            renderQuickLotsGrid();
            renderDashboard();
            startTimer();
        };

        function openRecordModal() {
            const modal = document.getElementById('recordModal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeRecordModal() {
            const modal = document.getElementById('recordModal');
            if (modal) modal.classList.add('hidden');
            document.getElementById('parkingForm').reset();
            removePhoto();
        }

        function loadFromLocalStorage() {
            const savedCurrent = localStorage.getItem('csu_current_parking');
            const savedHistory = localStorage.getItem('csu_parking_history');
            if (savedCurrent) {
                try { currentParking = JSON.parse(savedCurrent); } catch (e) {}
            }
            if (savedHistory) {
                try { parkingHistory = JSON.parse(savedHistory); } catch (e) {}
            }
        }

        function saveToLocalStorage() {
            if (currentParking) {
                localStorage.setItem('csu_current_parking', JSON.stringify(currentParking));
            } else {
                localStorage.removeItem('csu_current_parking');
            }
            localStorage.setItem('csu_parking_history', JSON.stringify(parkingHistory));
        }

        function renderDashboard() {
            const statusSection = document.getElementById('parkingStatusSection');
            const navCard = document.getElementById('navigationCard');
            if (!statusSection) return;

            if (currentParking) {
                if (navCard) navCard.classList.remove('hidden');
                statusSection.innerHTML = `
                    <div class="glass-panel p-5 rounded-3xl border border-zinc-600 shadow-xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 bg-zinc-200 text-zinc-950 font-extrabold text-[10px] uppercase tracking-wider px-3 py-1 rounded-bl-xl shadow">
                            停放中 ACTIVE
                        </div>
                        <div class="text-xs text-zinc-400 mb-1">目前車位位置</div>
                        <div class="text-xl font-black text-white tracking-tight mb-2">${escapeHtml(currentParking.lotName)}</div>
                        <div class="inline-flex items-center space-x-2 bg-zinc-800 border border-zinc-700 text-zinc-200 px-3 py-1 rounded-xl text-sm font-bold mb-4">
                            <span>${escapeHtml(currentParking.floor || '1F')} · 柱號: ${escapeHtml(currentParking.spotCode)}</span>
                        </div>
                        <div class="bg-zinc-900 rounded-2xl p-3.5 border border-zinc-800 mb-4 flex items-center justify-between">
                            <span class="text-zinc-400 text-xs">已停放總時數：</span>
                            <span id="liveTimerText" class="text-base font-black text-white font-mono">00 小時 00 分 00 秒</span>
                        </div>
                        ${currentParking.photo ? `<img src="${currentParking.photo}" class="w-full h-36 object-cover rounded-xl mb-4 border border-zinc-700">` : ''}
                        ${currentParking.memo ? `<div class="text-xs text-zinc-300 bg-zinc-800/50 p-2.5 rounded-xl border border-zinc-700/50 mb-4">${escapeHtml(currentParking.memo)}</div>` : ''}
                        <button onclick="confirmEndParking()" class="w-full bg-zinc-800 hover:bg-zinc-700 border border-zinc-600 text-white text-xs font-bold py-2.5 rounded-xl transition">
                            離場 / 結束停車
                        </button>
                    </div>
                `;
            } else {
                if (navCard) navCard.classList.add('hidden');
                statusSection.innerHTML = `
                    <div class="glass-panel p-6 rounded-3xl border border-zinc-800 shadow-lg text-center space-y-3">
                        <div>
                            <h2 class="text-base font-bold text-white">目前尚未紀錄車位</h2>
                            <p class="text-xs text-zinc-400 mt-1">停好車後點擊下方按鈕，秒記停放位置與柱號</p>
                        </div>
                        <button onclick="openRecordModal()" class="w-full bg-white hover:bg-zinc-200 text-zinc-950 font-bold py-3 px-4 rounded-xl shadow-md transition active:scale-[0.98]">
                            馬上紀錄車位
                        </button>
                    </div>
                `;
            }
            updateTimerDisplay();
        }

        function renderQuickLotsGrid() {
            const grid = document.getElementById('quickLotsGrid');
            if (!grid) return;
            grid.innerHTML = csuLocations.map(loc => `
                <button onclick="quickSelectLot('${loc}')" class="bg-zinc-800/80 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 p-2.5 rounded-xl text-left truncate transition active:scale-95">
                    <span class="truncate">${loc}</span>
                </button>
            `).join('');
        }

        function quickSelectLot(lotName) {
            document.getElementById('lotSelect').value = lotName;
            openRecordModal();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => { updateTimerDisplay(); }, 1000);
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('liveTimerText');
            if (!timerEl || !currentParking) return;
            const diffSeconds = Math.max(0, Math.floor((new Date().getTime() - new Date(currentParking.startTime).getTime()) / 1000));
            const pad = (n) => n.toString().padStart(2, '0');
            timerEl.innerText = `${pad(Math.floor(diffSeconds / 3600))} 小時 ${pad(Math.floor((diffSeconds % 3600) / 60))} 分 ${pad(diffSeconds % 60)} 秒`;
        }

        function getGPSLocation() {
            const gpsText = document.getElementById('gpsStatusText');
            if (!navigator.geolocation) return showToast("裝置不支援 GPS");
            gpsText.innerText = "定位中...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(6);
                    const lng = pos.coords.longitude.toFixed(6);
                    document.getElementById('latInput').value = lat;
                    document.getElementById('lngInput').value = lng;
                    gpsText.innerText = `經緯度: ${lat}, ${lng}`;
                    showToast("GPS 定位成功！");
                },
                () => { gpsText.innerText = "定位失敗"; showToast("GPS 存取受阻"); },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function triggerQuickGPS() {
            openRecordModal();
            getGPSLocation();
        }

        function handlePhotoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height, max = 800;
                    if (w > h && w > max) { h = Math.round((h * max) / w); w = max; }
                    else if (h > max) { w = Math.round((w * max) / h); h = max; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    selectedBase64Photo = canvas.toDataURL('image/jpeg', 0.75);
                    document.getElementById('photoPreview').src = selectedBase64Photo;
                    document.getElementById('photoPreviewContainer').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removePhoto() {
            selectedBase64Photo = '';
            document.getElementById('photoPreviewContainer').classList.add('hidden');
        }

        function saveParkingRecord(event) {
            event.preventDefault();
            const lotName = document.getElementById('lotSelect').value;
            const spotCode = document.getElementById('spotInput').value.trim();
            if (!lotName || !spotCode) return showToast("請填寫完整資訊！");

            currentParking = {
                id: 'park_' + Date.now(),
                lotName: lotName,
                floor: document.getElementById('floorInput').value.trim() || '1F',
                spotCode: spotCode,
                lat: document.getElementById('latInput').value,
                lng: document.getElementById('lngInput').value,
                photo: selectedBase64Photo,
                memo: document.getElementById('memoInput').value.trim(),
                startTime: new Date().toISOString()
            };

            saveToLocalStorage();
            renderDashboard();
            closeRecordModal();
            showToast("已成功儲存車位紀錄！");
        }

        function confirmEndParking() {
            if (!currentParking) return;
            const diffMin = Math.max(1, Math.floor((new Date().getTime() - new Date(currentParking.startTime).getTime()) / 60000));
            parkingHistory.unshift({
                ...currentParking,
                durationStr: `${Math.floor(diffMin / 60)}小時 ${diffMin % 60}分`
            });
            currentParking = null;
            saveToLocalStorage();
            renderDashboard();
            showToast("停車紀錄已結算歸檔");
        }

        function openHistoryModal() {
            renderHistoryList();
            const modal = document.getElementById('historyModal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeHistoryModal() {
            const modal = document.getElementById('historyModal');
            if (modal) modal.classList.add('hidden');
        }

        function renderHistoryList() {
            const listEl = document.getElementById('historyList');
            if (!listEl) return;
            if (parkingHistory.length === 0) {
                listEl.innerHTML = `<div class="text-center text-xs text-zinc-500 py-8">尚無歷史紀錄</div>`;
                return;
            }
            listEl.innerHTML = parkingHistory.map(item => `
                <div class="bg-zinc-800/60 border border-zinc-700/80 rounded-xl p-3 text-xs space-y-1">
                    <div class="font-bold text-zinc-200">${escapeHtml(item.lotName)} (${escapeHtml(item.spotCode)})</div>
                    <div class="text-zinc-400">時長：${item.durationStr}</div>
                </div>
            `).join('');
        }

        function confirmClearHistory() {
            parkingHistory = [];
            saveToLocalStorage();
            renderHistoryList();
            showToast("歷史紀錄已清空");
        }

        function openAppleMaps() {
            if (!currentParking) return;
            if (currentParking.lat && currentParking.lng) {
                window.location.href = `https://maps.apple.com/?daddr=${currentParking.lat},${currentParking.lng}&dirflg=w`;
            } else {
                window.location.href = `https://maps.apple.com/?q=${encodeURIComponent('正修科技大學 ' + currentParking.lotName)}&dirflg=w`;
            }
        }

        function openGoogleMaps() {
            if (!currentParking) return;
            if (currentParking.lat && currentParking.lng) {
                window.open(`https://www.google.com/maps/dir/?api=1&destination=${currentParking.lat},${currentParking.lng}&travelmode=walking`, '_blank');
            } else {
                window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('正修科技大學 ' + currentParking.lotName)}`, '_blank');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            if (!toast || !toastMsg) return;
            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            setTimeout(() => { toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4'); }, 2200);
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
